name: Fetch Daily Paper

on:
  schedule:
    - cron: "0 8 1 * *"      # 8am UTC on the 1st of each month
  workflow_dispatch:          # allow manual trigger

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run fetch script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_and_summarize.py

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/summary.json
          git diff --cached --quiet || git commit -m "chore: add paper $(date -u +%Y-%m-%d)"
          git push
